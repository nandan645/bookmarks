<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks - Quick & Smart Link Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Authentication Overlay -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="logo-icon" style="margin: 0 auto 1.25rem; width: 44px; height: 44px; font-size: 1.25rem;">⚡</div>
      <h2 id="authModeTitle">Sign In to Bookmarks</h2>
      <p>Organize, search, and securely share links with your team.</p>

      <form id="authForm">
        <div class="form-group" style="text-align: left;">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" class="form-control" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="form-group" style="text-align: left;">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Sign In</button>
      </form>

      <div style="margin-top: 1.25rem;">
        <button id="authToggleBtn" class="btn btn-secondary" style="width: 100%; justify-content: center; font-size: 0.82rem;">Need an account? Sign Up</button>
      </div>
    </div>
  </div>

  <!-- Main App Application Shell -->
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1>Bookmarks</h1>
      </div>

      <div class="nav-section">
        <div class="nav-label">Navigation</div>
        <button id="navAll" class="nav-btn active">
          <div class="left-content">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
            <span>All Bookmarks</span>
          </div>
        </button>
        <button id="navFavorites" class="nav-btn">
          <div class="left-content">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>Favorites</span>
          </div>
        </button>
        <button id="navShared" class="nav-btn">
          <div class="left-content">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Shared with Me</span>
          </div>
        </button>
      </div>

      <div class="nav-section" style="flex: 1; display: flex; flex-direction: column;">
        <div class="nav-label">
          <span>Virtual Folders</span>
          <button id="createFolderBtn" class="icon-btn-mini" title="New Folder">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
        <div id="folderList" class="folder-list">
          <!-- Folders injected via JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <span id="userEmail" class="user-email">user@domain.com</span>
          <button id="logoutBtn" class="icon-btn-mini" title="Sign Out">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div class="search-box-wrapper">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search by title, url, tags... (/ to focus)">
          <span class="kbd-shortcut">/</span>
        </div>

        <div class="top-actions">
          <button id="addBookmarkBtn" class="btn btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Add Link</span>
          </button>
        </div>
      </header>

      <div class="content-body">
        <div class="view-header">
          <div>
            <h2 id="viewTitle">All Bookmarks</h2>
            <div id="viewCount" class="view-meta">0 links</div>
          </div>
        </div>

        <!-- Tag Filter Pills -->
        <div id="tagBar" class="tag-bar"></div>

        <!-- Bookmarks Grid -->
        <div id="bookmarkGrid" class="bookmark-grid">
          <!-- Bookmarks rendered here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Add/Edit Bookmark -->
  <div id="bookmarkModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="bookmarkModalTitle">Add New Bookmark</h3>
        <button class="icon-btn-mini modal-close">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="bookmarkForm">
        <div class="form-group">
          <label for="bmUrl">Destination URL *</label>
          <input type="url" id="bmUrl" class="form-control" placeholder="https://example.com/docs" required>
        </div>
        <div class="form-group">
          <label for="bmTitle">Title *</label>
          <input type="text" id="bmTitle" class="form-control" placeholder="Project Documentation" required>
        </div>
        <div class="form-group">
          <label for="bmDesc">Description (Optional)</label>
          <textarea id="bmDesc" class="form-control" rows="2" placeholder="Quick note on what this link is for..."></textarea>
        </div>
        <div class="form-group">
          <label for="bmTags">Tags (comma separated)</label>
          <input type="text" id="bmTags" class="form-control" placeholder="docs, prod, dashboard">
        </div>
        <div class="form-group">
          <label for="bookmarkFolderSelect">Folder</label>
          <select id="bookmarkFolderSelect" class="form-control">
            <option value="">(No Folder / Root)</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Create Folder -->
  <div id="folderModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Create Virtual Folder</h3>
        <button class="icon-btn-mini modal-close">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="folderForm">
        <div class="form-group">
          <label for="folderName">Folder Name *</label>
          <input type="text" id="folderName" class="form-control" placeholder="e.g. Infrastructure & DevOps" required>
        </div>
        <div class="form-group">
          <label for="folderColor">Tag Color</label>
          <input type="color" id="folderColor" class="form-control" value="#6366f1" style="height: 42px; padding: 4px; cursor: pointer;">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Folder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Share Folder -->
  <div id="shareModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h3>Share Folder</h3>
          <p id="shareFolderName" style="font-size: 0.85rem; color: var(--accent-primary); font-weight: 500;"></p>
        </div>
        <button class="icon-btn-mini modal-close">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="shareForm" style="margin-bottom: 1.5rem;">
        <div style="display: flex; gap: 0.5rem;">
          <input type="email" id="shareEmail" class="form-control" placeholder="colleague@company.com" required style="flex: 1;">
          <select id="shareRole" class="form-control" style="width: 100px;">
            <option value="viewer">Viewer</option>
            <option value="editor">Editor</option>
          </select>
          <button type="submit" class="btn btn-primary">Share</button>
        </div>
      </form>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 0.5rem;">People with access</label>
        <div id="sharedMembersList" style="max-height: 160px; overflow-y: auto;">
          <!-- Member rows injected here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
