<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified - Bookmarks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-secondary);">

  <div class="auth-card" style="max-width: 400px; padding: 2.25rem 2rem;">
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #dcfce7; color: #15803d; display: grid; place-items: center; margin: 0 auto 1rem; font-size: 1.25rem;">
      ✓
    </div>

    <h2 style="font-size: 1.35rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">
      Email Verified!
    </h2>
    <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem; line-height: 1.5;">
      Your account has been confirmed successfully. You can now sign in and start organizing your links.
    </p>

    <a href="./" class="btn btn-primary" style="width: 100%; justify-content: center; text-decoration: none; padding: 0.65rem 1rem;">
      Go to Sign In
    </a>
  </div>

</body>
</html>
